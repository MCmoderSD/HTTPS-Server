name: Maven Deploy & Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: zulu
  MAVEN_ARGS: -B -ntp

jobs:
  deploy:
    name: Build, deploy and release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release')

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: setup-java
        name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          server-id: Nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - id: deploy
        name: Build and deploy to Nexus
        env:
          NEXUS_URL: ${{ vars.NEXUS_URL }}
          NEXUS_USERNAME: ${{ vars.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: mvn -T 1C clean deploy -DaltDeploymentRepository="Nexus::${NEXUS_URL}"

      - id: project
        name: Resolve project version
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          case "$VERSION" in
            *-SNAPSHOT) RELEASE=false ;;
            *)          RELEASE=true  ;;
          esac
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

          echo "Resolved version ${VERSION} (GitHub release: ${RELEASE})"

      - id: assets
        name: Collect release assets and checksums
        if: steps.project.outputs.release == 'true'
        run: |
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' \
            | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "::error::No build artifact found in target/"
            exit 1
          fi

          mkdir -p release-assets
          cp "$JAR" release-assets/
          find target -maxdepth 1 -type f \( -name '*-sources.jar' -o -name '*-javadoc.jar' \) \
            -exec cp {} release-assets/ \;

          {
            echo "md5=$(md5sum "$JAR" | cut -d ' ' -f 1)"
            echo "sha1=$(sha1sum "$JAR" | cut -d ' ' -f 1)"
            echo "sha256=$(sha256sum "$JAR" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

          echo "Release assets:"
          ls -1 release-assets

      - id: attest
        name: Attest build provenance
        if: steps.project.outputs.release == 'true'
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*.jar

      - id: changelog
        name: Build changelog link
        if: steps.project.outputs.release == 'true'
        env:
          VERSION: ${{ steps.project.outputs.version }}
        run: |
          PREVIOUS="$(git tag --sort=-creatordate | grep -vFx "$VERSION" | head -n 1 || true)"

          if [ -z "$PREVIOUS" ]; then
            echo "No previous tag found, linking full commit history"
            echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "Previous tag: ${PREVIOUS}"
            echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - id: release
        name: Create release
        if: steps.project.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.project.outputs.version }}
          REPO_NAME: ${{ github.event.repository.name }}
          CHANGELOG_URL: ${{ steps.changelog.outputs.url }}
          MD5: ${{ steps.assets.outputs.md5 }}
          SHA1: ${{ steps.assets.outputs.sha1 }}
          SHA256: ${{ steps.assets.outputs.sha256 }}
        run: |
          cat > release-notes.md <<EOF
          **Full Changelog**: ${CHANGELOG_URL}

          ## Checksums:

          - MD5: ${MD5}
          - SHA1: ${SHA1}
          - SHA256: ${SHA256}
          EOF

          gh release create "$VERSION" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "${REPO_NAME} - Release ${VERSION}" \
            --notes-file release-notes.md