name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release')

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'
          server-id: Nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Extract version and artifact name
        run: |
          echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "artifact=$(mvn help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)" >> $GITHUB_ENV

      - name: Build and Deploy
        run: mvn -B -ntp clean deploy

      - name: Delete existing release
        run: |
          if gh release view "${{ env.version }}" >/dev/null 2>&1; then
            echo "Release ${{ env.version }} already exists. Deleting release and tag."
            gh release delete "${{ env.version }}" -y --cleanup-tag
          else
            echo "No existing release found for ${{ env.version }}."
          fi

      - name: Get latest existing release tag
        run: |
          TAG=$(git tag --sort=-creatordate | grep -vFx "${{ env.version }}" | head -n 1 || true)
          if [ -z "$TAG" ]; then
            echo "No previous tag found."
            echo "changelog_url=https://github.com/${{ github.repository }}/commits/${{ env.version }}" >> $GITHUB_ENV
          else
            echo "Previous tag: $TAG"
            echo "changelog_url=https://github.com/${{ github.repository }}/compare/$TAG...${{ env.version }}" >> $GITHUB_ENV
          fi

      - name: Calculate Hashes
        run: |
          FILE=target/${{ env.artifact }}.jar
          echo "file=$FILE" >> $GITHUB_ENV
          echo "md5=$(md5sum "$FILE" | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "sha1=$(sha1sum "$FILE" | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "sha256=$(sha256sum "$FILE" | cut -d ' ' -f 1)" >> $GITHUB_ENV

      - name: Create new release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.file }}
          tag_name: ${{ env.version }}
          name: "${{ github.event.repository.name }} - Release ${{ env.version }}"
          body: |
            **Full Changelog**: ${{ env.changelog_url }}

            ## Checksums:

            - MD5: ${{ env.md5 }}
            - SHA1: ${{ env.sha1 }}
            - SHA256: ${{ env.sha256 }}